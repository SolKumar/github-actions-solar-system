name: Solar System Workflow - Latest


on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'


env:
  MONGO_URI : "mongodb+srv://supercluster.d83jj.mongodb.net/superData"
  MONGO_USERNAME: ${{ vars.mongo_username }}
  MONGO_PASSWORD: ${{ secrets.mongo_password}}
  DOCKER_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}


jobs:
    unit-testing:
      name: Unit Testing
      strategy:
        matrix:
          os: ["ubuntu-latest"]
      runs-on: ${{ matrix.os }}
      steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup NodeJS Version
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - name: Install Dependencies
        run: npm install
      - name: Unit Testing
        run: npm test
      - name: Archive Test Result
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-Mocha-Test-Result
          path: test-results.xml
    
    code-coverage:
      name: Code Coverage
      strategy:
        matrix:
          os: ["ubuntu-latest"]
      runs-on: ${{ matrix.os }}
      steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup NodeJS Version
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - name: Install Dependencies
        run: npm install
      - name: Code Coverage Verification
        continue-on-error: true
        run: npm run coverage
      - name: Archive Test Result
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name:  ${{ runner.os }}-Code-Coverage-Result
          path: coverage
          retention-days: 1

    docker-login:
      name: Login to Dockerhub
      needs: [unit-testing, code-coverage]
      runs-on: ubuntu-latest
      permissions: 
        packages: write
      steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Login to Docker
        uses: docker/login-action@v2.2.0
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}
      - name: Login to Github Container Registry(GHCR)
        uses: docker/login-action@v2.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: ${{ env.DOCKER_USERNAME }}/solar-system:${{ github.sha }}
      - name: Test Docker Image built
        run: |
          docker images
          docker run --name solar-system-app -d \
            -p 3000:3000 \
            -e MONGO_URI=${{ env.MONGO_URI }} \
            -e MONGO_USERNAME=${{ env.MONGO_USERNAME }} \
            -e MONGO_PASSWORD=${{ env.MONGO_PASSWORD }} \
            ${{ env.DOCKER_USERNAME }}/solar-system:${{ github.sha }}
          echo "Testing image using wget"
          wget -q -O  - 127.0.0.1:3000/live | grep live
      - name: Set Lowercase Repository Owner
        run: echo "REPO_OWNER_LOWER=$(echo $GITHUB_REPOSITORY_OWNER | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Push Docker Image to Dockerhub and GHCR
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: | 
            ${{ env.DOCKER_USERNAME }}/solar-system:${{ github.sha }}
            ghcr.io/${{ env.REPO_OWNER_LOWER }}/solar-system:${{ github.sha }}









